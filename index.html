<!doctype html>
<html lang="en" data-theme="invite">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#08135A">
  <title>A Very Important Survey</title>
  <meta name="description" content="Prepared exclusively for one very special girl.">
  <meta property="og:title" content="A Very Important Survey">
  <meta property="og:description" content="Prepared exclusively for one very special girl.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23C5162E' d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Decorative layers -->
  <div class="sky" aria-hidden="true"></div>
  <div class="hearts" id="hearts" aria-hidden="true"></div>
  <div class="burst-layer" id="burst-layer" aria-hidden="true"></div>

  <!-- Top bar: back button + flight-path progress (6E → EK) -->
  <header class="topbar">
    <button class="back-btn" id="back-btn" type="button" aria-label="Go back">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="flight" id="flight" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="7" aria-valuenow="0">
      <span class="flight__code">6E</span>
      <div class="flight__track">
        <div class="flight__fill" id="flight-fill"></div>
        <svg class="flight__plane" id="flight-plane" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
      </div>
      <span class="flight__code">EK</span>
    </div>
  </header>

  <main id="app">

    <!-- 1. Invitation -->
    <section class="screen" id="screen-invite" aria-labelledby="invite-title" hidden>
      <article class="card card--ticket">
        <p class="ticket__ref" aria-hidden="true"><span>Form HSN-1511</span><span>Confidential</span></p>
        <h1 class="title" id="invite-title" tabindex="-1" data-text="invite.title"></h1>
        <p class="subtitle" data-text="invite.subtitle"></p>
        <div class="perf" aria-hidden="true"></div>
        <dl class="ticket__fields" id="ticket-fields"></dl>
        <p class="opening" data-text="invite.opening"></p>
        <button class="btn btn--primary" type="button" data-action="next" data-text="invite.button"></button>
        <p class="fineprint" data-text="invite.disclaimer"></p>
      </article>
    </section>

    <!-- 2. Security check (unlock quiz) -->
    <section class="screen" id="screen-gate" aria-labelledby="gate-title" hidden>
      <article class="card">
        <p class="eyebrow">Identity verification</p>
        <h1 class="title title--sm" id="gate-title" tabindex="-1" data-text="unlock.title"></h1>
        <p class="subtitle" data-text="unlock.subtitle"></p>

        <form class="gate" id="gate-form" novalidate>
          <ol class="steps" id="gate-steps" aria-label="Security questions"></ol>
          <label class="question" for="gate-input" id="gate-label"></label>
          <input class="input" id="gate-input" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-describedby="gate-feedback gate-hint">
          <p class="feedback" id="gate-feedback" role="status" aria-live="polite"></p>
          <p class="hint" id="gate-hint" hidden></p>
          <button class="btn btn--primary" id="gate-submit" type="submit">Check</button>
        </form>

        <div class="gate-done" id="gate-done" hidden>
          <div class="badge" aria-hidden="true">✓</div>
          <h2 class="title title--sm" id="gate-done-title" tabindex="-1" data-text="unlock.doneTitle"></h2>
          <p class="subtitle" data-text="unlock.doneText"></p>
          <button class="btn btn--primary" type="button" data-action="next" data-text="unlock.doneButton"></button>
        </div>
      </article>
    </section>

    <!-- 3. Compatibility survey -->
    <section class="screen" id="screen-survey" aria-labelledby="survey-q" hidden>
      <article class="card">
        <p class="eyebrow eyebrow--split"><span data-text="surveyLabel"></span><span id="survey-count"></span></p>
        <h1 class="question question--lg" id="survey-q" tabindex="-1"></h1>
        <div class="choices" id="survey-choices" role="group" aria-labelledby="survey-q"></div>
        <p class="reaction" id="survey-reaction" aria-live="polite"></p>
        <button class="btn btn--primary" id="survey-next" type="button" hidden>Next question</button>
      </article>
    </section>

    <!-- 4. The accidental confession -->
    <section class="screen" id="screen-confess" aria-labelledby="confess-title" hidden>
      <article class="card card--chat">
        <h1 class="visually-hidden" id="confess-title" tabindex="-1">A chat with <span data-text="meNick"></span></h1>
        <div class="chat-head" aria-hidden="true">
          <span class="avatar">H</span>
          <span class="chat-head__who"><strong data-text="meNick"></strong><span class="chat-head__status" id="chat-status">online</span></span>
        </div>
        <ol class="chat" id="chat-log" aria-live="polite"></ol>
        <div class="chat-question" id="confess-question" hidden>
          <p class="question" id="confess-q" data-text="confession.question"></p>
          <div class="choices choices--grid" id="confess-choices" role="group" aria-labelledby="confess-q"></div>
        </div>
        <ol class="chat" id="confess-reply" aria-live="polite"></ol>
        <figure class="sticker" id="confess-sticker" hidden>
          <figcaption data-text="confession.stickerCaption"></figcaption>
          <img src="assets/girl-blushing.jpg" width="486" height="518" loading="lazy" alt="A little girl in a cap hiding her blushing face behind her hands, with red hearts around her">
        </figure>
        <button class="btn btn--primary" id="confess-next" type="button" data-action="next" hidden>Next</button>
      </article>
    </section>

    <!-- 5. The five-day negotiation -->
    <section class="screen" id="screen-days" aria-labelledby="days-title" hidden>
      <article class="card card--deal">
        <h1 class="stamp" id="days-title" tabindex="-1">Official negotiation</h1>

        <div class="ledger">
          <p class="ledger__row"><span><span data-text="meNick"></span>'s days</span><span class="ledger__count" id="wallet-count">5 / 10</span></p>
          <ol class="tokens" id="tokens" aria-hidden="true"></ol>
          <div class="big-days">
            <span class="big-days__num" id="big-days">5</span>
            <span class="big-days__unit">Days</span>
          </div>
          <p class="possession" data-text="negotiation.possession"></p>
        </div>

        <p class="question" id="days-q" data-text="negotiation.question"></p>
        <p class="muted" data-text="negotiation.pressureNote"></p>

        <div class="choices" id="days-choices" role="group" aria-labelledby="days-q">
          <button class="choice" type="button" data-days="yes" aria-pressed="false"><span class="choice__mark" aria-hidden="true">A</span><span class="choice__text" data-text="negotiation.yesLabel"></span></button>
          <button class="choice" type="button" data-days="no" aria-pressed="false"><span class="choice__mark" aria-hidden="true">B</span><span class="choice__text" data-text="negotiation.noLabel"></span></button>
          <button class="choice" type="button" data-days="negotiate" aria-pressed="false"><span class="choice__mark" aria-hidden="true">C</span><span class="choice__text" data-text="negotiation.negotiateLabel"></span></button>
        </div>

        <div class="negotiate" id="negotiate" hidden>
          <label class="negotiate__label" for="days-range">Days you'll return: <output id="days-output" for="days-range">3</output></label>
          <input class="range" id="days-range" type="range" min="0" max="5" step="1" value="3">
          <p class="range-quip" id="range-quip" aria-live="polite"></p>
          <button class="btn btn--ghost" id="seal-deal" type="button">Seal the deal</button>
        </div>

        <div class="days-result" aria-live="polite">
          <img class="tease" id="tease" src="assets/indigo-tease.png" width="494" height="332" alt="An IndiGo plane sticking its tongue out" hidden>
          <p class="reaction" id="days-reaction"></p>
        </div>

        <p class="fineprint" data-text="negotiation.terms"></p>
        <button class="btn btn--primary" id="days-next" type="button" data-action="next" hidden>Continue</button>
      </article>
    </section>

    <!-- 6. The first meeting -->
    <section class="screen" id="screen-memory" aria-labelledby="memory-title" hidden>
      <article class="card card--memory">
        <p class="eyebrow" data-text="memory.eyebrow"></p>
        <h1 class="title" id="memory-title" tabindex="-1" data-text="firstMeetingDate"></h1>
        <p class="subtitle" data-text="memory.subtitle"></p>
        <ol class="timeline" id="timeline" aria-live="polite"></ol>
        <figure class="polaroid polaroid--video" id="memory-video-wrap" hidden>
          <div class="video-frame" id="video-frame">
            <video id="blush-video" muted loop playsinline preload="none" width="480" height="848"></video>
            <button class="video-play" id="video-play" type="button" aria-label="Play the video">
              <span class="video-play__icon" aria-hidden="true">
                <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
                <svg class="icon-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></svg>
              </span>
            </button>
            <button class="video-expand" id="video-expand" type="button" aria-label="Watch the video full screen">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <figcaption data-text="memory.videoCaption"></figcaption>
        </figure>
        <div class="sticky-actions">
          <button class="btn btn--primary" id="memory-next" type="button">Next memory</button>
        </div>
      </article>
    </section>

    <!-- 7. The girlfriend question -->
    <section class="screen screen--bare" id="screen-question" aria-labelledby="question-title" hidden>
      <div class="ask">
        <svg class="big-heart" viewBox="0 0 24 24" aria-hidden="true">
          <defs><linearGradient id="heart-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E89AB3"/><stop offset="1" stop-color="#C5162E"/></linearGradient></defs>
          <path fill="url(#heart-grad)" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
        <p class="ask__greeting" data-text="question.greeting"></p>
        <div class="ask__msg" id="ask-msg"></div>
        <h1 class="ask__q" id="question-title" tabindex="-1" data-text="question.question"></h1>
        <div class="ask__actions">
          <button class="btn btn--primary btn--big" type="button" data-answer="yes" data-text="question.yesLabel"></button>
          <button class="btn btn--ghost" type="button" data-answer="december" data-text="question.laterLabel"></button>
        </div>
      </div>
    </section>

    <!-- 7b. December path -->
    <section class="screen screen--bare" id="screen-december" aria-labelledby="december-title" hidden>
      <div class="ask">
        <p class="emoji-xl" aria-hidden="true">😉</p>
        <h1 class="ask__q ask__q--sm" id="december-title" tabindex="-1" data-text="december.title"></h1>
        <p class="ask__msg" data-text="december.text"></p>
        <div class="ask__actions" id="december-actions">
          <button class="btn btn--primary btn--big" type="button" data-answer="yes" data-text="december.yesLabel"></button>
          <button class="btn btn--ghost" type="button" id="december-end" data-text="december.endLabel"></button>
        </div>
        <div class="december-closing" id="december-closing" hidden>
          <p class="hand hand--lg" data-text="december.closing"></p>
          <p class="sig" data-text="december.signature"></p>
          <button class="btn btn--link" type="button" data-answer="yes" data-text="december.changeMind"></button>
        </div>
      </div>
    </section>

    <!-- 8. The final surprise -->
    <section class="screen" id="screen-final" aria-labelledby="final-title" hidden>
      <article class="card card--final">
        <p class="eyebrow eyebrow--gold" data-text="final.eyebrow"></p>
        <h1 class="title" id="final-title" tabindex="-1" data-text="final.title"></h1>
        <p class="subtitle" data-text="final.subtitle"></p>

        <figure class="polaroid">
          <img id="final-photo" width="722" height="950" alt="">
          <figcaption data-text="final.photoCaption"></figcaption>
        </figure>

        <h2 class="question" id="nick-q" data-text="final.nicknamePrompt"></h2>
        <div class="chips" id="nick-choices" role="group" aria-labelledby="nick-q"></div>

        <form class="nick-form" id="nick-form" novalidate hidden>
          <label class="nick-form__label" for="nick-input" data-text="final.customLabel"></label>
          <div class="nick-form__row">
            <input class="input" id="nick-input" type="text" maxlength="24" autocomplete="off" enterkeyhint="done" aria-describedby="nick-error">
            <button class="btn btn--primary btn--inline" type="submit" data-text="final.customButton"></button>
          </div>
          <p class="feedback" id="nick-error" role="status" aria-live="polite"></p>
        </form>

        <div class="closing" id="closing" hidden>
          <p class="closing__lead" id="closing-lead" tabindex="-1"></p>
          <p class="closing__body" id="closing-body"></p>
          <p class="hand hand--lg" id="closing-signoff"></p>
          <p class="sig" id="closing-sig"></p>
          <dl class="record" id="record"></dl>
          <button class="btn btn--link" type="button" data-action="reset">Replay from the start</button>
        </div>
      </article>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
